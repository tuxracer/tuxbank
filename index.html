<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="TuxBank" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Local-first budget calendar that tracks deposits and withdrawals on a full-page month view, works offline with no account, and offers optional end-to-end encrypted sync across devices."
    />
    <meta
      name="keywords"
      content="budget calendar, money calendar, local-first, offline budget app, end-to-end encrypted sync, personal finance, deposits and withdrawals, recurring expenses, cash flow calendar, privacy-focused budgeting"
    />
    <meta name="repository" content="https://github.com/tuxracer/tuxbank" />
    <title>TuxBank Budget Calendar</title>
    <script defer src="/boot-refresh.js"></script>
    <style>
      :root {
        color-scheme: light dark;
      }

      .boot-notice {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: #eff2f6;
        color: #1b2430;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 12px;
        line-height: 1.6;
      }

      #boot-fallback {
        visibility: hidden;
      }

      #root:empty ~ #boot-fallback {
        animation: boot-fallback-reveal 0s 5s forwards;
      }

      @keyframes boot-fallback-reveal {
        to {
          visibility: visible;
        }
      }

      .boot-notice div {
        max-width: 460px;
        border: 1px solid #d6dde6;
        background: #ffffff;
        padding: 16px;
      }

      .boot-notice p {
        margin: 0 0 12px;
      }

      .boot-notice p:last-child {
        margin-bottom: 0;
      }

      .boot-notice button {
        margin: 0 0 12px;
        padding: 8px 20px;
        border: 1px solid #0e7490;
        background: #ffffff;
        color: #0e7490;
        font: inherit;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .boot-notice-title {
        color: #0e7490;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .boot-notice-note {
        color: #5c6d7f;
      }

      @media (prefers-color-scheme: dark) {
        .boot-notice {
          background: #0a0c11;
          color: #c8d4e0;
        }

        .boot-notice div {
          border-color: #1b2431;
          background: #0d1119;
        }

        .boot-notice-title {
          color: #22d3ee;
        }

        .boot-notice-note {
          color: #6b7c8f;
        }

        .boot-notice button {
          border-color: #22d3ee;
          background: #0d1119;
          color: #22d3ee;
        }
      }
    </style>
    <noscript>
      <style>
        #boot-fallback {
          display: none;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-fallback" class="boot-notice">
      <div>
        <p class="boot-notice-title">◢ TuxBank didn’t open</p>
        <p>
          Something went wrong while loading this page. Refreshing usually fixes
          it.
        </p>
        <button id="boot-refresh" type="button">Refresh</button>
        <p>
          If that doesn’t help, press Ctrl + Shift + R (Cmd + Shift + R on a
          Mac), or hold Shift and click your browser’s reload button.
        </p>
        <p class="boot-notice-note">Your saved events are safe.</p>
      </div>
    </div>
    <noscript>
      <div class="boot-notice">
        <div>
          <p class="boot-notice-title">◢ JavaScript is required</p>
          <p>
            TuxBank runs entirely in your browser. It needs JavaScript to draw
            the calendar and to read the events saved on this device.
          </p>
          <p>Turn JavaScript on for this site, then reload the page.</p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
