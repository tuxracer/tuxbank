<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="ground" cx="0.35" cy="0.22" r="1.15">
      <stop offset="0" stop-color="#151d2e" />
      <stop offset="0.55" stop-color="#0b0f18" />
      <stop offset="1" stop-color="#06080d" />
    </radialGradient>
    <radialGradient id="ambientCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.15" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ambientGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.22" />
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0" stop-color="#000000" stop-opacity="0" />
      <stop offset="0.78" stop-color="#000000" stop-opacity="0" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.4" />
    </radialGradient>
    <linearGradient id="cyanCell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dedfc" />
      <stop offset="1" stop-color="#0e9cb8" />
    </linearGradient>
    <linearGradient id="goldCell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a" />
      <stop offset="1" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="bloom" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#ground)" />

  <!-- the calendar field runs past the edges -->
  <g stroke="#22d3ee" stroke-width="1" opacity="0.07">
    <path d="M56 0V512 M156 0V512 M256 0V512 M356 0V512 M456 0V512" />
    <path d="M0 56H512 M0 156H512 M0 256H512 M0 356H512 M0 456H512" />
  </g>

  <!-- ambient light cast by the bright end of the month -->
  <rect x="-70" y="130" width="600" height="600" fill="url(#ambientCyan)" />
  <rect x="126" y="226" width="360" height="360" fill="url(#ambientGold)" />

  <!-- bloom under the hottest cells -->
  <g filter="url(#bloom)">
    <rect x="164" y="364" width="84" height="84" fill="#22d3ee" opacity="0.55" />
    <rect x="264" y="364" width="84" height="84" fill="#fbbf24" opacity="0.6" />
    <rect x="364" y="264" width="84" height="84" fill="#22d3ee" opacity="0.3" />
  </g>

  <!-- past days: ink accumulates through the month like the running balance -->
  <g fill="url(#cyanCell)">
    <rect x="64" y="64" width="84" height="84" rx="6" opacity="0.07" />
    <rect x="164" y="64" width="84" height="84" rx="6" opacity="0.12" />
    <rect x="264" y="64" width="84" height="84" rx="6" opacity="0.09" />
    <rect x="364" y="64" width="84" height="84" rx="6" opacity="0.16" />
    <rect x="64" y="164" width="84" height="84" rx="6" opacity="0.2" />
    <rect x="164" y="164" width="84" height="84" rx="6" opacity="0.15" />
    <rect x="264" y="164" width="84" height="84" rx="6" opacity="0.27" />
    <rect x="364" y="164" width="84" height="84" rx="6" opacity="0.22" />
    <rect x="64" y="264" width="84" height="84" rx="6" opacity="0.34" />
    <rect x="164" y="264" width="84" height="84" rx="6" opacity="0.48" />
    <rect x="264" y="264" width="84" height="84" rx="6" opacity="0.4" />
    <rect x="364" y="264" width="84" height="84" rx="6" opacity="0.58" />
    <rect x="64" y="364" width="84" height="84" rx="6" opacity="0.78" />
    <rect x="164" y="364" width="84" height="84" rx="6" />
  </g>

  <!-- today -->
  <rect x="264" y="364" width="84" height="84" rx="6" fill="url(#goldCell)" />

  <!-- the future: outline only -->
  <rect x="364" y="364" width="84" height="84" rx="6" fill="#22d3ee" opacity="0.05" />
  <rect
    x="365.5"
    y="365.5"
    width="81"
    height="81"
    rx="5"
    fill="none"
    stroke="#22d3ee"
    stroke-width="3"
    opacity="0.3"
  />

  <!-- glass sheen on every tile -->
  <g fill="url(#glass)">
    <rect x="64" y="64" width="84" height="84" rx="6" opacity="0.22" />
    <rect x="164" y="64" width="84" height="84" rx="6" opacity="0.27" />
    <rect x="264" y="64" width="84" height="84" rx="6" opacity="0.24" />
    <rect x="364" y="64" width="84" height="84" rx="6" opacity="0.31" />
    <rect x="64" y="164" width="84" height="84" rx="6" opacity="0.35" />
    <rect x="164" y="164" width="84" height="84" rx="6" opacity="0.30" />
    <rect x="264" y="164" width="84" height="84" rx="6" opacity="0.42" />
    <rect x="364" y="164" width="84" height="84" rx="6" opacity="0.37" />
    <rect x="64" y="264" width="84" height="84" rx="6" opacity="0.49" />
    <rect x="164" y="264" width="84" height="84" rx="6" opacity="0.63" />
    <rect x="264" y="264" width="84" height="84" rx="6" opacity="0.55" />
    <rect x="364" y="264" width="84" height="84" rx="6" opacity="0.73" />
    <rect x="64" y="364" width="84" height="84" rx="6" opacity="0.93" />
    <rect x="164" y="364" width="84" height="84" rx="6" />
    <rect x="264" y="364" width="84" height="84" rx="6" />
  </g>

  <!-- specular top edge on the two hottest tiles -->
  <rect x="170" y="365" width="72" height="2" rx="1" fill="#ffffff" opacity="0.5" />
  <rect x="270" y="365" width="72" height="2" rx="1" fill="#ffffff" opacity="0.55" />

  <rect width="512" height="512" fill="url(#vignette)" />
</svg>
